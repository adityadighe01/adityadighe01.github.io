<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal profile of Aditya Dighe.">
  <meta name="robots" content="index,follow">
  <title>Aditya Dighe</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 32px 18px; background: #090909; color: #f4f1ec;
      font-family: Georgia, "Times New Roman", serif;
    }
    main { width: min(100%, 760px); text-align: center; }
    .photo {
      width: min(78vw, 360px); aspect-ratio: 4 / 5; object-fit: cover;
      object-position: center 35%; border-radius: 18px;
      border: 1px solid #37332d; box-shadow: 0 24px 70px #000b;
    }
    .eyebrow {
      margin: 30px 0 10px; color: #b9a98e; font: 11px/1.4 Arial, sans-serif;
      letter-spacing: .32em; text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(38px, 8vw, 64px); font-weight: 400; letter-spacing: .02em; }
    .rule { width: 54px; height: 1px; background: #9b8768; margin: 22px auto; }
    p { color: #bcb8b0; font: 15px/1.7 Arial, sans-serif; margin: 0 auto; max-width: 420px; }
    footer { margin-top: 54px; color: #77716a; font: 11px Arial, sans-serif; letter-spacing: .12em; }
  </style>
</head>
<body>
  <main>
    <img class="photo" src="profile.png" alt="Portrait of Aditya Dighe">
    <div class="eyebrow">Personal profile</div>
    <h1>Aditya Dighe</h1>
    <div class="rule"></div>
    <p>A personal space for my profile and interests.</p>
    <footer>ADITYA DIGHE</footer>
  </main>
</body>
</html>
